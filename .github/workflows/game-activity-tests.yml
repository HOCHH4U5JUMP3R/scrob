name: Game activity regression tests

on:
  push:
    branches:
      - feat/games-history-german-activity
  pull_request:
    branches:
      - main
    paths:
      - backend/core/game_activity.py
      - backend/models/game_play_activity.py
      - backend/routers/games.py
      - backend/routers/profile.py
      - backend/tests/test_game_activity_adjustments.py

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: test-secret-key-for-game-activity-tests
      DATABASE_URL: postgresql+asyncpg://test:test@127.0.0.1:5432/test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend and test dependencies
        run: python -m pip install -e ./backend pytest

      - name: Compile changed backend modules
        run: python -m compileall -q backend/core/game_activity.py backend/models/game_play_activity.py backend/routers/games.py backend/routers/profile.py

      - name: Run activity regression tests
        working-directory: backend
        run: pytest -q tests/test_game_activity_adjustments.py
