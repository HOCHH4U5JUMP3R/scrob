name: Main omnibus image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: main-omnibus-image
  cancel-in-progress: true

jobs:
  build:
    name: Build and publish main omnibus image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push omnibus image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.omnibus
          platforms: linux/amd64
          push: true
          build-args: |
            APP_VERSION=main-${{ github.sha }}
          tags: |
            ghcr.io/hochh4u5jump3r/scrob:main-omnibus
            ghcr.io/hochh4u5jump3r/scrob:latest-omnibus
            ghcr.io/hochh4u5jump3r/scrob:sha-${{ github.sha }}-omnibus
          cache-from: type=gha,scope=scrob-main-omnibus
          cache-to: type=gha,mode=max,scope=scrob-main-omnibus
